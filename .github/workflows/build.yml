{
  "name": "meu-navegador",
  "version": "1.0.0",
  "description": "Um navegador de internet baseado no Chromium",
  "author": "Seu Nome <seu@email.com>",
  "main": "main.js",
  "scripts": {
    "start": "electron .",
    "build": "electron-builder"
  },
  "build": {
    "appId": "com.navegador.avancado",
    "productName": "MeuNavegador",
    "directories": {
      "output": "dist"
    },
    "win": {
      "target": ["nsis"]
    },
    "linux": {
      "target": ["AppImage", "deb"],
      "maintainer": "Seu Nome <seu@email.com>"
    }
  },
  "devDependencies": {
    "electron": "^28.3.3",
    "electron-builder": "^24.13.3"
  }
}
